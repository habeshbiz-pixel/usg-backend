services:
  - type: web
    name: usg-backend
    runtime: node
    plan: free
    buildCommand: npm install && node src/models/migrate.js
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      # ── Server ────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      # ALLOWED_ORIGINS should be your frontend/app origin, not the backend URL.
      # Update this after your Expo app is published (e.g. https://your-app.netlify.app)
      - key: ALLOWED_ORIGINS
        value: https://usg-backend.onrender.com

      # ── Database (paste Neon connection string in Render dashboard) ──
      - key: DATABASE_URL
        sync: false

      # ── JWT (auto-generated by Render) ────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # ── Stripe ────────────────────────────────────────────
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_BASIC
        sync: false
      - key: STRIPE_PRICE_PLUS
        sync: false
      - key: STRIPE_PRICE_PREMIUM
        sync: false

      # ── Twilio ────────────────────────────────────────────
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

      # ── AWS S3 ────────────────────────────────────────────
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET
        value: usg-uploads

      # ── Firebase ──────────────────────────────────────────
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
